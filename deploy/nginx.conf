# =============================================================================
# jeffreychoguen.cloud — configuration Nginx de production
#
# Le site est un export statique : Nginx ne fait que servir out/. Aucun
# processus Node ne tourne sur le serveur.
#
# Installation :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/jeffreychoguen
#   sudo ln -s /etc/nginx/sites-available/jeffreychoguen /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Les chemins de certificat supposent Certbot. Adapter si besoin.
# =============================================================================

# --- HTTP → HTTPS ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jeffreychoguen.cloud www.jeffreychoguen.cloud;
    return 301 https://jeffreychoguen.cloud$request_uri;
}

# --- www → domaine nu --------------------------------------------------------
# Une seule URL canonique : sans cette redirection, Google indexerait deux
# copies du site et partagerait l'autorité entre elles.
server {
    # « listen … http2 » plutôt que « http2 on; », qui n'existe qu'à partir
    # de Nginx 1.25.1 — or les serveurs tournent en 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jeffreychoguen.cloud;
    ssl_certificate     /etc/letsencrypt/live/jeffreychoguen.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeffreychoguen.cloud/privkey.pem;
    return 301 https://jeffreychoguen.cloud$request_uri;
}

# --- Site --------------------------------------------------------------------
server {
    # « listen … http2 » plutôt que « http2 on; », qui n'existe qu'à partir
    # de Nginx 1.25.1 — or les serveurs tournent en 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jeffreychoguen.cloud;

    root  /var/www/jeffreychoguen;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/jeffreychoguen.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeffreychoguen.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- En-têtes de sécurité ---------------------------------------------
    include /etc/nginx/snippets/jeffreychoguen-security.conf;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # Les .gz de tesseract sont volontairement ABSENTS de cette liste : on ne
    # recompresse pas un fichier déjà compressé, et surtout on ne doit pas lui
    # ajouter un Content-Encoding (cf. location tessdata plus bas).
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript application/manifest+json
               image/svg+xml application/wasm;

    # --- Routage ---------------------------------------------------------------
    # trailingSlash: true dans next.config : /en/tools/ → /en/tools/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- Cache ----------------------------------------------------------------
    # Fichiers de build horodatés par un hachage : immuables, cache d'un an.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/jeffreychoguen-security.conf;
        # Moteur ONNX livré par le build : modules ES et WebAssembly.
        location ~ \.mjs$ { types { } default_type text/javascript; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/jeffreychoguen-security.conf; }
        location ~ \.wasm$ { types { } default_type application/wasm; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/jeffreychoguen-security.conf; }
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/jeffreychoguen-security.conf;
    }

    # --- Assets des outils : le point qui casse en production -----------------
    #
    # En local tout fonctionne ; en production, un type MIME faux suffit à
    # tout faire échouer. Un worker PDF.js servi en application/octet-stream
    # est REFUSÉ par le navigateur, et PDF→JPG, PDF→Word et l'OCR tombent.
    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/jeffreychoguen-security.conf;

        location ~ \.mjs$ { types { } default_type text/javascript; add_header Cache-Control "public, max-age=2592000"; include /etc/nginx/snippets/jeffreychoguen-security.conf; }
        location ~ \.wasm$ { types { } default_type application/wasm; add_header Cache-Control "public, max-age=2592000"; include /etc/nginx/snippets/jeffreychoguen-security.conf; }

        # Données de langue tesseract : déjà compressées. Servies en
        # application/gzip SANS Content-Encoding — sinon le navigateur les
        # décompresserait en route et tesseract recevrait autre chose que
        # ce qu'il attend.
        location /vendor/tessdata/ {
            gzip off;
            types { } default_type application/gzip;
            add_header Cache-Control "public, max-age=2592000";
            include /etc/nginx/snippets/jeffreychoguen-security.conf;
        }

        # Modèle de détourage : morceaux nommés par hachage, sans extension.
        location /vendor/bg/ {
            gzip off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/snippets/jeffreychoguen-security.conf;
        }
    }

    # HTML et fichiers de navigation : toujours revalidés, pour qu'un
    # déploiement soit visible immédiatement.
    location ~* \.(html|txt|xml)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/jeffreychoguen-security.conf;
    }

    # Métadonnées macOS : ne jamais les servir, même si l'une s'est glissée.
    location ~ /\.DS_Store$ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }
}
