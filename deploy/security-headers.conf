# En-têtes de sécurité — INCLUS dans chaque bloc location qui pose ses propres
# en-têtes.
#
# Piège Nginx : un bloc location qui définit ne serait-ce qu'un add_header
# n'hérite plus d'AUCUN add_header du niveau serveur. Sans cet include
# répété, chaque bloc de cache ferait silencieusement disparaître HSTS, la CSP
# et X-Frame-Options — précisément sur les pages HTML.
#
# « always » : envoyés aussi sur les réponses d'erreur.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;

# CSP en REPORT-ONLY au lancement : une politique fausse appliquée d'emblée
# casserait le site pour tout le monde. Vérifier la console sur chaque outil,
# puis retirer « -Report-Only ».
#
# 'unsafe-inline' (scripts) : inévitable en export statique — Next y injecte
# la charge de navigation, et sans serveur aucun nonce n'est possible.
# 'wasm-unsafe-eval' : OCR, détourage et moteur ONNX.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'; upgrade-insecure-requests" always;
